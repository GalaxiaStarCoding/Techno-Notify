# Render blueprint for the Techno-Notify TT5 bridge.
# In Render: New -> Blueprint -> point this repo at it, then deploy.
services:
  - type: web
    name: techno-notify-tt5-bridge
    runtime: python
    region: oregon            # change to your nearest region
    plan: free                # bump to starter once you go live
    branch: main
    rootDir: bridge
    healthCheckPath: /health
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
